<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A little surprise for Asoum ✨</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,600;1,500;1,600&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #8c2a38;
      --primary-gradient: linear-gradient(135deg, #8c2a38 0%, #b83b4d 100%);
      --gold: #d4a373;
      --card-bg: rgba(255, 255, 255, 0.88);
      --text-dark: #2c1a14;
      --text-muted: #7a685a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-dark);
      background: linear-gradient(135deg, #fceade 0%, #f3d5d8 50%, #e8c5c8 100%);
      overflow: hidden;
      position: relative;
    }

    /* Background animated bubbles */
    .bg-bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      filter: blur(20px);
      animation: floatBg 8s infinite ease-in-out;
      z-index: 0;
    }
    .bubble-1 { width: 250px; height: 250px; top: -50px; left: -50px; }
    .bubble-2 { width: 300px; height: 300px; bottom: -80px; right: -50px; animation-delay: 4s; }

    /* Main Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      padding: 45px 35px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px rgba(140, 42, 56, 0.12), 
                  0 2px 8px rgba(0, 0, 0, 0.04);
      position: relative;
      z-index: 1;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: cardAppear 0.8s ease-out;
    }

    /* Icon Badge */
    .icon-wrapper {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
      font-size: 32px;
      box-shadow: 0 10px 22px rgba(255, 154, 158, 0.4);
      animation: pulse 3s ease-in-out infinite;
    }

    .subtitle {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 10px;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 600;
      font-style: italic;
      color: var(--text-dark);
      line-height: 1.35;
      margin-bottom: 12px;
    }

    .disclaimer {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 30px;
    }

    .description {
      font-size: 15px;
      line-height: 1.7;
      color: #4a382c;
      margin-bottom: 25px;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      min-height: 55px;
      position: relative;
    }

    button {
      padding: 14px 30px;
      border-radius: 50px;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      outline: none;
    }

    .btn-yes {
      background: var(--primary-gradient);
      color: white;
      box-shadow: 0 8px 20px rgba(140, 42, 56, 0.3);
    }

    .btn-yes:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 25px rgba(140, 42, 56, 0.4);
    }

    .btn-no {
      background-color: #f0e5df;
      color: #6b584c;
    }

    .btn-no:hover {
      background-color: #e5d6cc;
    }

    .message-no {
      font-size: 12px;
      color: var(--primary);
      margin-top: 18px;
      font-weight: 500;
      font-style: italic;
      min-height: 20px;
    }

    .place-badge {
      display: inline-block;
      background: #fbf0ea;
      color: var(--primary);
      padding: 6px 16px;
      border-radius: 12px;
      font-weight: 600;
      border: 1px dashed rgba(140, 42, 56, 0.3);
      margin-top: 8px;
      font-size: 16px;
    }

    .hidden {
      display: none !important;
    }

    /* Animations */
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatBg {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, 30px); }
    }
  </style>
</head>
<body>

  <div class="bg-bubble bubble-1"></div>
  <div class="bg-bubble bubble-2"></div>

  <!-- STEP 1 : Don't be sad Asoum -->
  <div id="step-1" class="card">
    <div class="icon-wrapper">💖</div>
    <div class="subtitle">Hey you...</div>
    <h1>Don't be sad Asoum... 🥹</h1>
    <p class="disclaimer">(Are you feeling a little better already? 😉)</p>
    
    <div class="btn-group">
      <button class="btn-no" id="btn-no" onclick="handleNo()">Still sad 🥺</button>
      <button class="btn-yes" onclick="nextStep()">Smile! ✨</button>
    </div>
    <div id="no-message" class="message-no"></div>
  </div>

  <!-- STEP 2 : You will be in Marseille soon -->
  <div id="step-2" class="card hidden">
    <div class="icon-wrapper">✈️</div>
    <div class="subtitle">Keep your smile!</div>
    <h1>Everything will be fine ✨</h1>
    
    <p class="description">
      Remember... <br>
      <span class="place-badge">📍 You will be in Marseille soon 🌊☀️</span> <br><br>
      Get ready, stay positive and be happy because good things are coming your way! 💛
    </p>

    <div style="font-size: 28px; margin-top: 15px; animation: pulse 2s infinite;">🌊✨</div>
  </div>

  <script>
    let noClickCount = 0;
    const noMessages = [
      "No sadness allowed! 🙅‍♂️",
      "Come on, keep smiling!",
      "You got this, Asoum! 💪",
      "Just click 'Smile!' already! ✨"
    ];

    function handleNo() {
      const btnNo = document.getElementById('btn-no');
      const msgDiv = document.getElementById('no-message');
      
      if (noClickCount < noMessages.length) {
        msgDiv.innerText = noMessages[noClickCount];
      }
      
      noClickCount++;
      const currentScale = Math.max(0.2, 1 - noClickCount * 0.2);
      btnNo.style.transform = `scale(${currentScale})`;
    }

    function nextStep() {
      // Confetti effect
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#8c2a38', '#d4a373', '#ff9a9e', '#ffffff']
      });

      const step1 = document.getElementById('step-1');
      const step2 = document.getElementById('step-2');

      step1.style.opacity = '0';
      step1.style.transform = 'translateY(-20px)';

      setTimeout(() => {
        step1.classList.add('hidden');
        step2.classList.remove('hidden');
      }, 400);
    }
  </script>
</body>
</html>
